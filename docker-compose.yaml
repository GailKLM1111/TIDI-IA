#    ports:
#      - 80:90
#    depends_on:
#      - postgres
#    networks:
#      - tidi-ia-network
  sistema:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 5000:5000
    depends_on:
      - postgres
    networks:
      - tidi-ia-network