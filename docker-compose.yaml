networks:
  tidi-ia-network:
volumes:
    tidi-ia-db-data:
services:
  postgres:
    image: postgres:latest
    container_name: tidi-ia-db
    environment:
      POSTGRES_USER: tidi_ia_admin
      POSTGRES_PASSWORD: TIDIia
      POSTGRES_DB: BD_TIDI_IA
    ports:
      - 5432:5432
    volumes:
      - tidi-ia-db-data:/var/lib/postgresql/
    networks:
      - tidi-ia-network
